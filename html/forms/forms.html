<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./custom.css">

</head>
<body>
    <h1>Student Registration Form</h1>
    <fieldset style="background-color: aqua;">
    <form>
        <label for="rollno">Roll No:</label>
        <input type="number" name="rollno" id="rollno">
        <br><br>
        <label for="student_name">Student name:</label>
        <input type="text" placeholder="First Name">-
        <input type="text" placeholder="Last Name">
        <br><br>
        <label for="fathers_name">Father's name:</label>
        <input type="text">
        <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="number" placeholder="Day">-
        <input type="number" placeholder="Month">-
        <input type="number" placeholder="Year">
        <br><br>
        <label for="mobile">Mobile No:</label>
        <input type="tel" value="+91 ">
        <br><br>
        <lable for="Email">Email id:</lable>
        <input type="text">
        <br><br>
        <lable for="password">Password:</lable>
        <input type="password">
        <br><br>
        <lable for="gender">Gender:</lable>
        <input type="radio" name="gender" id="gender">Male
        <input type="radio" name="gender" id="gender">Female
        <br><br>
        <lable for="languages">Languages:</lable>
        <br><br>
        <input type="checkbox" name="languages" id="languages">HTML
        <input type="checkbox" name="languages" id="languages">CSS
        <input type="checkbox" name="languages" id="languages">JAVA
        <input type="checkbox" name="languages" id="languages">C
        <!-- drop down -->
        <br><br>
        <label for="courses">courses:</label>
        <select name="id">
         <option value="">---select course ----</option>
         <option value="CSS">CSS</option>
         <option value="JS">JS</option>
        </select>
        <br><br>
        <label>Student photo :</label>
        <input type="file">
        <br><br>
        <label for="Address">Address:</label>
        <textarea></textarea>
        <br><br>
        <button type="submit">Register</button>

       
     

      
      


    </form>
    </fieldset>
</body>
</html>
