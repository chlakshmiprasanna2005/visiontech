<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day2Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0e0e11;
        --surface: #18181c;
        --border: #2a2a32;
        --accent: #c8f135;
        --accent-dim: #9ebd28;
        --text: #f0f0f3;
        --muted: #6b6b7a;
        --danger: #ff4d6d;
        --radius: 14px;
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        display: flex;
        justify-content: center;
        padding: 2.5rem 1rem 4rem;
      }

      /* ── background texture ── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            ellipse 60% 40% at 70% 10%,
            rgba(200, 241, 53, 0.07) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 30% at 10% 90%,
            rgba(200, 241, 53, 0.04) 0%,
            transparent 60%
          );
        pointer-events: none;
        z-index: 0;
      }

      .app {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 560px;
      }

      /* ── header ── */
      header {
        margin-bottom: 2.4rem;
      }
      .logo {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--text);
      }
      .logo span {
        color: var(--accent);
      }
      .tagline {
        margin-top: 0.4rem;
        font-size: 0.85rem;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* ── stats strip ── */
      .stats {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.6rem;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.55rem 0.9rem;
        font-size: 0.78rem;
        color: var(--muted);
        flex: 1;
        text-align: center;
        transition: border-color var(--transition);
      }
      .stat strong {
        display: block;
        font-family: "Syne", sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.2;
      }
      .stat.accent strong {
        color: var(--accent);
      }

      /* ── input row ── */
      .input-row {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.4rem;
      }
      #todo-input {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.8rem 1.1rem;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        color: var(--text);
        outline: none;
        transition:
          border-color var(--transition),
          box-shadow var(--transition);
      }
      #todo-input::placeholder {
        color: var(--muted);
      }
      #todo-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(200, 241, 53, 0.12);
      }
      #add-btn {
        background: var(--accent);
        color: #0e0e11;
        border: none;
        border-radius: var(--radius);
        padding: 0.8rem 1.3rem;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--transition),
          transform var(--transition);
      }
      #add-btn:hover {
        background: #d8ff3d;
      }
      #add-btn:active {
        transform: scale(0.96);
      }

      /* ── filter tabs ── */
      .filters {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 1.2rem;
      }
      .filter-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.4rem 0.9rem;
        font-family: "DM Sans", sans-serif;
        font-size: 0.8rem;
        color: var(--muted);
        cursor: pointer;
        transition: all var(--transition);
      }
      .filter-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .filter-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #0e0e11;
        font-weight: 500;
      }

      /* ── todo list ── */
      #todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .todo-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 0.9rem;
        padding: 0.85rem 1rem;
        transition:
          border-color var(--transition),
          transform var(--transition),
          opacity var(--transition);
        animation: slideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      .todo-item:hover {
        border-color: #3a3a45;
        transform: translateY(-1px);
      }
      .todo-item.completed {
        opacity: 0.55;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* custom checkbox */
      .check-wrap {
        position: relative;
        flex-shrink: 0;
        width: 22px;
        height: 22px;
      }
      .check-wrap input[type="checkbox"] {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        margin: 0;
        z-index: 1;
      }
      .check-box {
        width: 22px;
        height: 22px;
        border: 1.5px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition);
        pointer-events: none;
      }
      .check-wrap input:checked ~ .check-box {
        background: var(--accent);
        border-color: var(--accent);
      }
      .check-box svg {
        opacity: 0;
        transform: scale(0.5);
        transition: all var(--transition);
      }
      .check-wrap input:checked ~ .check-box svg {
        opacity: 1;
        transform: scale(1);
      }

      .todo-text {
        flex: 1;
        font-size: 0.93rem;
        line-height: 1.4;
        transition: text-decoration var(--transition);
        word-break: break-word;
      }
      .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .del-btn {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--muted);
        font-size: 1rem;
        flex-shrink: 0;
        transition: all var(--transition);
      }
      .del-btn:hover {
        border-color: var(--danger);
        color: var(--danger);
        background: rgba(255, 77, 109, 0.08);
      }

      /* ── empty state ── */
      .empty {
        text-align: center;
        padding: 3.5rem 1rem;
        color: var(--muted);
        font-size: 0.9rem;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        display: none;
      }
      .empty.show {
        display: block;
      }
      .empty-icon {
        font-size: 2.4rem;
        margin-bottom: 0.7rem;
      }

      /* ── clear completed ── */
      .bottom-bar {
        display: flex;
        justify-content: flex-end;
        margin-top: 1rem;
        min-height: 28px;
      }
      .clear-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 0.8rem;
        cursor: pointer;
        transition: color var(--transition);
        display: none;
      }
      .clear-btn:hover {
        color: var(--danger);
      }
      .clear-btn.show {
        display: block;
      }

      /* ── responsive ── */
      @media (max-width: 480px) {
        body {
          padding: 1.6rem 0.8rem 3rem;
        }
        .input-row {
          flex-direction: column;
        }
        #add-btn {
          width: 100%;
          padding: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">Day<span>2</span>Day</div>
        <p class="tagline">Stay on top of everything</p>
      </header>

      <div class="stats">
        <div class="stat"><strong id="stat-total">0</strong>Total</div>
        <div class="stat accent"><strong id="stat-done">0</strong>Done</div>
        <div class="stat"><strong id="stat-left">0</strong>Left</div>
      </div>

      <div class="input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to get done?"
          autocomplete="off"
        />
        <button id="add-btn">+ Add</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="todo-list"></ul>
      <div class="empty" id="empty-state">
        <div class="empty-icon">✦</div>
        No tasks here. Add one above!
      </div>

      <div class="bottom-bar">
        <button class="clear-btn" id="clear-btn">Clear completed</button>
      </div>
    </div>

    <script>
      // ── DOM refs ──────────────────────────────────────────────
      const input = document.querySelector("#todo-input");
      const addBtn = document.querySelector("#add-btn");
      const todoList = document.querySelector("#todo-list");
      const emptyEl = document.querySelector("#empty-state");
      const clearBtn = document.querySelector("#clear-btn");
      const statTotal = document.querySelector("#stat-total");
      const statDone = document.querySelector("#stat-done");
      const statLeft = document.querySelector("#stat-left");

      // ── State ─────────────────────────────────────────────────
      let todos = [];
      let filter = "all"; // "all" | "active" | "completed"

      // ── Add ───────────────────────────────────────────────────
      const addTodo = () => {
        const text = input.value.trim();
        if (text === "") return;

        todos.push({ id: Date.now(), text, completed: false });
        input.value = "";
        render();
      };

      // ── Delete ────────────────────────────────────────────────
      const deleteTodo = (id) => {
        // FIX: id param
        todos = todos.filter((todo) => todo.id !== id);
        render();
      };

      // ── Toggle ────────────────────────────────────────────────
      const toggleTodo = (id) => {
        // FIX: id param
        todos = todos.map((todo) =>
          todo.id === id ? { ...todo, completed: !todo.completed } : todo,
        );
        render();
      };

      // ── Render ────────────────────────────────────────────────
      const render = () => {
        todoList.innerHTML = "";

        // filter
        const visible = todos.filter((t) => {
          if (filter === "active") return !t.completed;
          if (filter === "completed") return t.completed;
          return true;
        });

        // stats
        const doneCount = todos.filter((t) => t.completed).length;
        statTotal.textContent = todos.length;
        statDone.textContent = doneCount;
        statLeft.textContent = todos.length - doneCount;

        // clear button visibility
        clearBtn.classList.toggle("show", doneCount > 0);

        // empty state
        emptyEl.classList.toggle("show", visible.length === 0);

        // build items                // FIX: all li/checkbox/span/delBtn inside forEach
        visible.forEach((todo) => {
          const li = document.createElement("li");
          li.className = "todo-item" + (todo.completed ? " completed" : "");

          // custom checkbox wrapper
          const checkWrap = document.createElement("label");
          checkWrap.className = "check-wrap";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const checkBox = document.createElement("span");
          checkBox.className = "check-box";
          checkBox.innerHTML = `<svg width="12" height="10" viewBox="0 0 12 10" fill="none">
            <path d="M1.5 5L4.5 8L10.5 1.5" stroke="#0e0e11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`;

          checkWrap.appendChild(checkbox);
          checkWrap.appendChild(checkBox);

          // text span
          const span = document.createElement("span");
          span.className = "todo-text";
          span.textContent = todo.text;

          // delete button
          const delBtn = document.createElement("button");
          delBtn.className = "del-btn";
          delBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>`;
          delBtn.setAttribute("aria-label", "Delete task");
          delBtn.addEventListener("click", () => deleteTodo(todo.id));

          li.appendChild(checkWrap);
          li.appendChild(span);
          li.appendChild(delBtn);
          todoList.appendChild(li);
        });
      };

      // ── Filter tabs ───────────────────────────────────────────
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelector(".filter-btn.active")
            .classList.remove("active");
          btn.classList.add("active");
          filter = btn.dataset.filter;
          render();
        });
      });

      // ── Clear completed ───────────────────────────────────────
      clearBtn.addEventListener("click", () => {
        todos = todos.filter((t) => !t.completed);
        render();
      });

      // ── Event listeners ───────────────────────────────────────
      addBtn.addEventListener("click", addTodo);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });

      render(); // initial paint
    </script>
  </body>
</html>
